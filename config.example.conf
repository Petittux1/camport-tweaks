# XiaomiCamPort 配置 v0.9.3（改完重启相机生效，不需要重装模块）
#
# ★ 本模块自带「开箱即用」预设（v0.9.3）：即使没有这份文件，
#   也会自动启用 observe_only=false + 机型伪装 + 焦段修正 + 闪退修复等已定案功能。
#   这份文件只是给你**覆盖/微调**用的；一旦存在，就完全以这里为准。
#
# log: 0=关 1=基本 2=详细。看 support() 与能力门的逐条记录必须用 2。
log=2

# 安全闸门。true=只记录不改变相机任何行为。
# 已定案功能默认已启用（false）；想纯观察调试时改成 true。
observe_only=false

# ── 机型伪装（v0.7.0+）──────────────────────────────
# 装的是 madrid(小米18 Pro Max) 的相机，在 pudding(小米17) 上跑，
# 相机会在启动约 3 秒后判定「APK 版本和机型不匹配」并自行退出。
# 修法（v0.7.3 实测最小集）：只改 Build.DEVICE 就够了，但**必须极早** ——
# 相机有类在静态初始化阶段就把 Build.DEVICE 抄进了自己的 static 字段，
# 在 Application.onCreate 里再改已经晚了（日志里覆写全 ✔，行为不变）。
# 本模块现在在 handleLoadPackage（相机进程里最早的一刻）就完成覆写。
build.DEVICE=madrid

# 想要「彻底伪装成 madrid」（连 EXIF / 水印里都写 madrid）再打开下面这几行。
# 注意：加了之后拍出来的照片 EXIF Model 会变成 madrid 的名字，
#       且 Build.SKU 参与镜头/机型映射，有风险，非必要别开。
# build.MODEL=Xiaomi M154FF
# build.PRODUCT=madrid
# build.ODM_SKU=madrid
# build.SKU=madrid
# prop.ro.product.device=madrid
# prop.ro.product.mod_device=madrid
# prop.ro.product.marketname=Xiaomi 18 Pro Max

# prop.<属性名>=<值>：只覆写**本进程内** SystemProperties.get 的返回值。
# 注意 ro.product.mod_device 单独改**不足以**修掉退出问题（实测）。

# 强制显示某个模式（类全名，可写多行）。仅在 observe_only=false 时生效。
# 内置预设默认已解锁 AI帮拍（AI 拍摄助手，需联网）；不需要可删掉下面这行。
enable_mode=com.android.camera.features.mode.ai.AiModuleEntry

# 强制隐藏某个模式（可写多行）。
# disable_mode=

# 覆盖能力门的返回值，格式 cap=方法名=true|false（可写多行，一次只加一项）。
# 方法名从日志的「能力缺口清单」里取 —— 那里列出的都是本机返回 false 的能力门。
# 同名方法会作用于所有声明它的类。
# cap=isSupportMIVI2=true

# ── 焦段档位重映射（v0.6.0）────────────────────────
# 装的是 madrid 的相机，底部焦段按钮显示的是 madrid 的镜头表
#       [0.7, 1.0, 2.0, 3.2, 6.4]，其中 3.2x(75mm) 和 6.4x(147mm) 是 madrid 的
#       长焦/潜望焦段，pudding 根本没有这两颗镜头。
# pudding 的正确档位 = [0.7, 1.0, 2.0, 2.6, 5.0]：
#       0.7x = 超广角 17mm   1.0x = 主摄 23mm   2.0x = 主摄数码 46mm
#       2.6x = 长焦 60mm（EXIF 实测 35mm 等价 = 60）  5.0x = 长焦数码 115mm
# 用法：只改「值不对的那几个」，格式 旧:新。不要整表替换，
#       因为档位表是按模式不同的（拍照 [0.7,1.0,2.0,3.2,6.4]，人像 [1.0,2.0,3.2,4.3]）。
zoom_remap=3.2:2.6,6.4:5.0

# ── 焦段档位剔除（v0.8.3 全局 / v0.8.5 按模式）────────────
# 有的档位不是「值不对」，而是「压根不该出现」—— 那种要用剔除，重映射做不到。
# 重映射只能改值，改不掉「档位个数」；只有剔除能让按钮少一个。
# 格式：逗号分隔的浮点值（就是档位表里原样写的那几个数）。
# ★ 执行顺序：先 zoom_remap、后 zoom.drop（比较基准是重映射后的值）。
#
# 两种写法：
#   zoom.drop=4.3            全局：所有模式都剔 4.3
#   zoom.drop.<模式号>=2.0,4.3  只在该模式剔（推荐，避免误伤别的模式）
#     163=拍照   171=人像
#
# 为什么按模式剔很重要：同一个数值在不同模式下含义不同。
#   2.0x 在拍照模式 = 主摄数码 46mm（有效档位，要留）；
#        在人像模式 = 用户明确不要的档位（要剔）。全局剔会误伤拍照。
# 实测（人像 [1.0,2.0,3.2,4.3] → 只留 1.0x / 2.6x）：
#   zoom_remap=3.2:2.6 + zoom.drop.171=2.0,4.3
#   → 先重映射 [1.0,2.0,2.6,4.3] → 再剔除 2.0 与 4.3 → 最终 [1.0, 2.6]（按钮 2 个）
# 安全阀：若一次剔除会把整个数组清空，模块放弃本次剔除并记一条警告。
zoom.drop.171=2.0,4.3

# ── 退出链路保险（v0.7.2）──────────────────────────
# 静态分析（tools/disasm.py）确认：ActivityBase 的 Handler
#   Lcom/android/camera/a$c#handleMessage 里 msg.what==11 的动作是
#   E4.u.es(...) 挂上 CameraExitHint + 打印 'on APK version error'，
#   CameraExitHint 里 3 秒的 RxJava 定时器到点即 Camera.finish()，相机自己消失。
# 把这条消息吞掉，退出链路就断了。仅在 observe_only=false 时生效。
block.msg=11

# 打印这些 Handler 消息的**发送方调用栈**（定位「谁触发了这条退出」用）。
# 平时留空，排查时改成 trace.msg=11。
# trace.msg=11

# ── 色彩风格：调出「原色」（v0.8.0）────────────
# madrid 相机顶栏风格有三档：徕卡生动 / 徕卡经典 / 原色，pudding 上只出前两档。
# 闸门 = Ll9/h;->E2(Ll9/g;)Z（== 位掩码 Ll9/g;->J0(3)）。强制 true 后原色进列表。
# 实测：列表 2→3 项；三档 updateCvType 分别 = 0 / 1 / 2（成片真的应用）。
cvtype.natural=1

# ── 「2亿像素」拍照闪退修复（v0.8.1，默认开）───────────
# PixelModule.onActive() 走「事件型快门动画」分支时不创建 mPixelManager，
# 而 onCaptureStart() 没判空就调 mPixelManager.b() → NPE 崩溃。
# 修法：onCaptureStart 期间把闸门 l3()（isSupportMiviFlashNight）压成 false，
# 跳过像素动画块，capture 本体照常执行（复刻 prepareNormalCapture 的优雅降级）。
pixel.fix=1

# ── 实况视频几何（v0.9.0，实验，默认关）────────────────
# 实况照片(动态照片/实况运镜)的内嵌视频尺寸由 Gm.s.b2()（LiveShotManager.getVideoSize）决定；
# MasterLive 分支会把它转成竖屏（new Size(h, w)）→ 本机拿到 1440x1920，
# 而相机侧实况流是 1920x1440，导致编码器输入只被填了一部分（纯绿 + 行重复）。
# 置 1 时把返回值换回横屏，走与普通录像相同的横屏编码路径（播放仍由 muxer 旋转元数据摆正）。
# liveshot.orient=1
# 对照实验：把实况视频尺寸**钉成已知可用的值**。
# 实测同一条 CircularMediaRecorder 路径下，普通「动态照片」= 1296x1728 时内嵌视频完全正常；
# 若把 MasterLive 也钉成 1296x1728 后画面变正常，即证明问题出在尺寸而非编码栈。
# liveshot.size=1296x1728

# ── 实况运镜「绿色花屏」修复 live231size（默认开）────────────
# 症状：拍实况运镜，内嵌的实况视频大面积绿色花屏；普通「动态照片」正常。
# 根因（对坏帧原始平面做 stride 扫描实测）：
#   PostProcService 不管收 1920x1440 还是 1728x1296，都按 1728x1296 往
#   ImageReader 里写 —— Y 平面是 stride=1728 的 1296 行（2239488 字节整除），
#   UV 平面同样是 stride=1728。而 mode 231 却把 reader 开成了 1920x1440：
#   应用按 1920 的行距去读 1728 的数据 -> 整体错位 + 没写到的区域全 0
#   -> Y=125 U=0 V=0 -> BT.601 反算正好是纯绿 = 绿色花屏。
#   mode 163 传的正好是 1728x1296，所以普通实况没问题。
# 修法：hook m6.n.c()（getLivePhotoVideoSize，2_5 实况流尺寸的唯一上游），
#       仅在 mode==231 时把返回值改成服务端真正输出的尺寸。
#       下游 getVideoSize 2_5 / ImageReader / configSurface 全部自动跟随。
# 改完重启相机（force-stop）生效，不需要重装模块。
live231size=auto
# ---- 实况运镜成片观感（MasterLiveTune）----
# legend.zoomdur=<秒>  覆盖快门触发的运镜动画时长（原自由/红毯 3.0、主角 2.0）；0=不改
#                       成片只能覆盖动画的前 ~1.13s，压到 1.1s 才推得完
# legend.aflock=0|1|2   0=关  1=跳过值没变的重复 applyAfMode  2=窗口内强制 AF_MODE_AUTO 冻结
# legend.afwin=<秒>     AF 介入窗口（从 startAutoZoom 起算），默认 2.0
legend.zoomdur=1.1
legend.aflock=2
legend.afwin=2.0
# live231size=auto       改成「基础尺寸 x 0.9」，复刻 mode 163 的规则
# live231size=off        关掉本修复（会回到花屏状态）

# ── 传奇一瞬 色彩落地（LegendFix）────────────────────────
# 18 Pro Max 的传奇色彩在 HAL 调参里，本机 HAL 没有（vendor tag 未注册），
# 所以改成把 M3/M9/M10R 映射到相机自带的 CubeLut 滤镜（预览 + 成片都生效）。
# 改完重启相机（force-stop）生效，不需要重装模块。
#
# legend.color=1                 总开关 1/0（0 = 完全不干预）
# legend.filter.<风格>=<滤镜>     M3=黑白传奇 M9=CCD传奇 M10R=CMOS传奇
#   值可以写数字 id，或 LUT 名 / 滤镜名，例如：
#   legend.filter.m9=84          (84=N_KC_64 Kodachrome64)
#   legend.filter.m9=lut_normal_classic  (=78)
#   legend.filter.m9=classic            (=78)
#   可选 LUT：classic 78 / film 71 / negative_film 60 / original 62 /
#             nature 73 / whiteandblack 77 / japanese 72 / c_64 84 /
#             h_400 86 / p_400h 88 / v_5207 85 / blackgold 76
# legend.degree=100              滤镜强度 0-100
legend.color=1
legend.filter.m3=77
legend.filter.m9=84
legend.filter.m10r=73
legend.degree=100

# ── 帧探针范围 live.probe（默认 231，Mode231Fix）──────────────
# 为什么必须能关：
#   AI帮拍(168)、拍照(163)、2亿(175) 的 2_5 实况流和 mode 231 是**同一个尺寸**
#   （1728x1296 / 2560x1440），只看尺寸就会误命中，于是探针会在别人的会话里
#   每帧扫 3 个 plane + 算均值，并在 acquireNextImage 的 afterHook 里同步
#   往 /sdcard 写近 1MB 的 PPM。实测：只采 231 时一天写盘 2 次，放开成 all
#   后一天命中 162/163/168/175/231、写盘 134 次。
# off   = 整条探针停掉（连 enc 帧日志也不打）
# 231   = 只采实况运镜 = 10-01 的原始行为（默认）
# all   = 按尺寸白名单全采（排查用，会拖慢 AI帮拍）
live.probe=231

# ── 智能构图 ai.smartcomp（SmartCompFix）────────────────────
# ⚠️ 当前状态：开关能显示「开」，但**功能实际不生效**（画面没有构图裁剪），
#    而且开关点不掉。这两个键的作用是**把这堆 hook 和别人隔离开**，
#    方便 A/B —— 关掉之后本仓库其余功能完全不受影响。
#    真正的根因（CompositionList 拿不到数据 / HAL 缺 autoCrop.* vendor tag）
#    还没解决，见 README「还没解决」。
# ai.smartcomp=0        完全不 hook 智能构图
# ai.smartcomp=1        启用钩子（默认）
# ai.smartcomp.submit=0 只打日志；=1 才真的调 A3.g.w()（submitAiComposition）
ai.smartcomp=1
ai.smartcomp.submit=0

# ── AI帮拍 自动HDR互斥阻断 ai.hdrfix（HdrFix）───────────────
# 进 AI帮拍(0xa8) 时相机会因「自动HDR」抢模式而互相打架，
# 阻断日志形如：阻断 AI帮拍 进入自动HDR互斥。
# ai.hdrfix=0  不阻断   ai.hdrfix=1  阻断（默认）
ai.hdrfix=1
